[package]
name = "truesight"
version = "0.1.0"
edition = "2024"
description = "Dota 2 hero strength ratings from public ranked matches"
license = "MIT"
repository = "https://github.com/serephus/truesight"
homepage = "https://github.com/serephus/truesight"
readme = "README.md"
rust-version = "1.89"

[dependencies]
anyhow = "1"
clickhouse = { version = "0.15.3", default-features = false, features = [
    "lz4",
    "rustls-tls-ring",
    "rustls-tls-webpki-roots",
] }
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
    "tracing",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "gzip",
    "http2",
    "json",
    "query",
    "rustls-no-provider",
    "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "ring",
    "std",
    "tls12",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.7", features = [
    "compression-gzip",
    "set-header",
    "timeout",
    "trace",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
strip = true
