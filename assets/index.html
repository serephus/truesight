<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Truesight — Dota 2 hero strength</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark">◈</span>
      <span>Truth<em>sight</em></span>
    </div>
    <div class="meta" id="meta">
      <span class="muted">Loading ratings…</span>
    </div>
  </header>

  <nav class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab active" data-view="leaderboard">Leaderboard</button>
      <button class="tab" data-view="matchups">Matchups</button>
      <button class="tab" data-view="matches">Recent matches</button>
    </div>
    <div class="tabs periods" id="periods">
      <button class="tab active" data-period="day">Day</button>
      <button class="tab" data-period="week">Week</button>
      <button class="tab" data-period="month">Month</button>
    </div>
    <input id="search" class="search" type="search" placeholder="Search hero…" autocomplete="off">
  </nav>

  <div id="error" class="error" hidden></div>

  <main>
    <section id="view-leaderboard" class="view">
      <div class="summary" id="summary"></div>
      <div class="table-wrap">
        <table class="leaderboard">
          <thead>
            <tr>
              <th class="num">#</th>
              <th>Hero</th>
              <th class="num">Rating</th>
              <th class="num">±</th>
              <th class="num">Δ</th>
              <th class="num">Games</th>
              <th class="num">Win rate</th>
            </tr>
          </thead>
          <tbody id="hero-rows"></tbody>
        </table>
      </div>
    </section>

    <section id="view-matchups" class="view" hidden>
      <div class="matchups">
        <aside class="hero-picker">
          <h2>Heroes</h2>
          <div id="hero-picker-list" class="hero-picker-list"></div>
        </aside>
        <div id="counter-panel" class="counter-panel">
          <p class="muted">Pick a hero to see who it beats and loses to.</p>
        </div>
      </div>
    </section>

    <section id="view-matches" class="view" hidden>
      <div id="matches" class="matches"></div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <article class="modal-card" role="dialog" aria-modal="true">
      <button class="close" data-close aria-label="Close">×</button>
      <div id="modal-body"></div>
    </article>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
